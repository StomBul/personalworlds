plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    // Curios API: нужен только для компиляции интеграции (слоты аксессуаров разделяются вместе с инвентарём).
    exclusiveContent {
        forRepository {
            maven {
                name = "Illusive Soulworks"
                url = "https://maven.theillusivec4.top/"
            }
        }
        filter {
            includeGroup "top.theillusivec4.curios"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Автотесты (GameTest) — отдельный набор исходников, в итоговый jar не попадает.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestCompileClasspath.extendsFrom compileClasspath
    gametestRuntimeClasspath.extendsFrom runtimeClasspath
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
